name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when a branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Confirm the static output exists
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          echo "dist contains $(find dist -type f | wc -l) files"
